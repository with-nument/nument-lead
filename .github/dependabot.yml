version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/engine"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/web"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
