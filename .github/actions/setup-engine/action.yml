name: Set up the engine
description: >-
  uv with a dependency cache keyed on engine/uv.lock, Python 3.12, the engine's locked runtime dependencies,
  and Chromium with its system libraries when asked (only the night run crawls).
inputs:
  playwright:
    description: Install Chromium for Playwright
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      with:
        enable-cache: true
        cache-dependency-glob: engine/uv.lock

    - name: Install Python 3.12
      shell: bash
      run: uv python install 3.12

    - name: Install engine dependencies
      shell: bash
      working-directory: engine
      run: |
        uv sync --frozen --no-dev
        # Later `uv run` calls use this environment as it is (no dev tools, no re-resolve).
        echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"

    - name: Cache Playwright browsers
      if: inputs.playwright == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('engine/uv.lock') }}

    - name: Install Chromium and its system libraries
      if: inputs.playwright == 'true'
      shell: bash
      working-directory: engine
      run: uv run playwright install --with-deps chromium
