name: Report a failed scheduled run
description: >-
  Opens one issue per failing workflow, or comments on the open one, so the founder gets one email per
  failure streak instead of relying on GitHub's mail to whoever last edited the workflow file. Needs
  `issues: write` on the job.
inputs:
  workflow:
    description: Workflow name, used in the issue title
    required: true
runs:
  using: composite
  steps:
    - name: Open or update the failure issue
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW: ${{ inputs.workflow }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        title="Scheduled run failing: ${WORKFLOW}"
        number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"${title}\" in:title" \
          --json number,title --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
        body="The ${WORKFLOW} run failed on $(date -u '+%Y-%m-%d %H:%M') UTC: ${RUN_URL}"
        if [ -n "$number" ]; then
          gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
        else
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
            --body "${body}"$'\n\n'"Close this issue once the cause is fixed. The Engine page in the app shows the run's phases and error."
        fi
