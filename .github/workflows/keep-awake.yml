# Keeps the Render web app warm: the free plan sleeps after 15 idle minutes and the first visit then waits
# about a minute. Public repository, so these runs cost no Actions minutes. GitHub may delay scheduled
# runs under load, so Supabase pg_cron also pings every 10 minutes (migration 0013); this one is a backup.
name: Keep web app awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # The address people use (lead.nument.in, a custom domain on the same Render service), then the
      # onrender.com one, so a DNS or certificate problem on the custom domain still keeps the service warm and
      # shows up as a warning. /api/health makes no database call and skips the session proxy.
      - name: Ping the health endpoint
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://lead.nument.in/api/health; then exit 0; fi
            echo "::warning::lead.nument.in did not answer, trying the onrender.com address"
            if curl -fsS --max-time 60 https://nument-leads-web.onrender.com/api/health; then exit 0; fi
            sleep 20
          done
          echo "::warning::health endpoint did not answer"
