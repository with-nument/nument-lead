# Weekly run (Step 14.5.4): learning, then the audit, then the weekly report. The report step stores the
# report, emails it when email is configured, and writes it into this job's summary.
# Supabase pg_cron starts this run on time (migration 0013). The GitHub schedule below is only a fallback: it runs when the repository variable SCHEDULES_ENABLED is "true" (off since 13 Nov 2026, it fired hours late).
name: Weekly learning and report

on:
  schedule:
    - cron: "30 1 * * 1" # Monday 07:00 IST
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        type: choice
        options: [prod, dev]
        default: prod
      dry_run:
        description: Dry run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nument-pipeline-${{ inputs.env || 'prod' }}
  cancel-in-progress: false

jobs:
  weekly:
    if: github.event_name == 'workflow_dispatch' || vars.SCHEDULES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Repository-level secrets and variables: GitHub environments need a paid plan on a private personal
    # repository. Live sheet ids reach prod runs only; dev runs see only the staging sheet.
    permissions:
      contents: read
      issues: write
    env:
      APP_ENV: ${{ inputs.env || 'prod' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ET_GATEWAY_KEY: ${{ secrets.ET_GATEWAY_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_MASTER_ID: ${{ (inputs.env || 'prod') == 'prod' && vars.SHEET_MASTER_ID || '' }}
      SHEET_CALLER_ID: ${{ (inputs.env || 'prod') == 'prod' && vars.SHEET_CALLER_ID || '' }}
      SHEET_STAGING_ID: ${{ (inputs.env || 'prod') == 'dev' && vars.SHEET_STAGING_ID || '' }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }} # empty = Nument Leads <leads@nument.in>
      ALERT_REPLY_TO: ${{ vars.ALERT_REPLY_TO }} # empty = the founder's address
      APP_URL: ${{ vars.APP_URL }} # links in emails; empty = the Render URL
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }} # morning list, alerts and weekly report by email
      IN_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-engine

      - name: Weekly run
        working-directory: engine
        run: |
          args=(--env "$APP_ENV")
          if [ "$IN_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          uv run nlead run weekly "${args[@]}"

      - name: Email new alerts
        if: failure()
        working-directory: engine
        run: uv run nlead health --notify --env "$APP_ENV" || true # a failed weekly run reaches the alert list

      - name: Report the failure
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/notify-failure
        with:
          workflow: Weekly learning and report
