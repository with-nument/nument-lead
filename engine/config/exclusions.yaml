# Whole words in the name that mean the place is not our kind of business in any segment, whatever its
# map category says (live check 12 Nov: a furniture store and a marriage bureau were filed as clinics).
non_target_keywords:
  - furniture
  - matrimony
  - matrimonial
  - marriage bureau
  - jewellers
  - jewellery
  - restaurant
  - bakery
  - supermarket
  - hardware
  - electronics
  - mobile store
  - showroom
  - petrol pump

hospital_keywords:            # whole words in the name. Small Indian clinics sometimes call themselves
  - hospital                  # a "hospital" (for example "dental hospital"): check R3 rejects in week 1
  - hospitals
  - medical college
  - institute of medical sciences
  - super speciality hospital
  - multispeciality hospital
  - nursing home

agency_keywords:              # in name, category or site title: they sell what we sell
  - digital marketing
  - marketing agency
  - seo agency
  - seo services
  - web design
  - web development
  - web solutions
  - app development
  - software development
  - software solutions
  - it services
  - it solutions
  - infotech
  - technologies pvt
  - ai solutions
  - automation agency
  - placement consultancy
  - staffing
  - recruitment agency

# The partner track (13 Nov 2026): marketing and design agencies are white-label partners, not competitors.
# These agency keywords do not exclude a business in a partners segment; software, app and IT shops, staffing
# and recruitment firms still do.
partner_ok_keywords:
  - digital marketing
  - marketing agency
  - seo agency
  - seo services
  - web design

competitors:                  # software vendors and platforms in our space: never leads (names or domains)
  - aisensy
  - interakt
  - gallabox
  - wati
  - leadsquared
  - zoho
  - freshworks
  - haptik
  - yellow.ai
  - gupshup
  - kaleyra
  - exotel
  - knowlarity
  - practo

max_branches: 10              # 10 or more branches = a big chain (Steps 6 and 8)
