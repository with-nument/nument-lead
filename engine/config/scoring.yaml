# engine/config/scoring.yaml : default scoring numbers (Step 11 owns the formula)
# A segment's `scoring:` block overrides any value here for that segment (lists are replaced).
# Fixed in score.py, not here: signal decay steps, SCORE_VERSION.
#
# Score s2.0 (13 Nov 2026): four parts that add up to 100, so the number is the lead's quality and the grade
# always follows it:
#   need (0 to 35) + can pay (0 to 35) + fit (0 to 10) + reach (0 to 20)
# A strong business with no buying signal lands at about 55 to 65 (B), fit plus a fresh visible pain at about
# 70 to 85, a stated need with money and a direct mobile at 90 to 100.

fit:
  gate: 2                       # fit below 2 = grade D (reason fit_gate)
  bonus: {3: 10, 2: 6, 1: 0, 0: 0}

can_pay:
  cap: 30                       # proxy points are capped here, then scaled to `points`
  points: 35                    # the can-pay part of the total
  branches: [{min: 4, points: 8}, {min: 2, points: 6}]     # tiers: the first that matches counts
  staff:    [{min: 8, points: 6}, {min: 3, points: 4}]
  reviews:  [{min: 300, points: 6}, {min: 100, points: 4}]
  premium_price: 5              # a verified price_point at or above the segment's threshold
  pays_for_software: 3          # booking system, CRM, live chat, WhatsApp API provider, claimed Practo
  custom_website: 2             # live site on its own domain, not a free builder sub-domain
  funding: 6                    # an active funding signal
  retainer_fit: 3               # ongoing work likely: a partner agency, a full-time builder hire, an online store
  too_big: -4                   # 200+ staff: rarely buys from a young studio (winnability, 13 Nov 2026)
  # ticket class points (0 to 6) come from the segment's ticket_class

intent:                         # shown as "Need" in the app and the email
  cap: 35
  # A signal's points (A.12.3, for example public_ask 10, review_pain 7) times its category's multiplier.
  multiplier: {stated_need: 3.5, visible_pain: 2.2, growth: 2.0, money: 2.0}
  # Visible pain, growth and fresh funding alone can never look like a stated need. Funding counts only where a
  # segment gives it points (firms: 5, "just funded" is a growth sign; 13 Nov 2026).
  category_cap: {visible_pain: 24, growth: 12, money: 12}
  stack_bonus_per_type: 3       # for each signal type after the first
  stack_bonus_max: 6

reach:                          # share of the reach points: how directly we can reach the decision maker
  # 15 Nov 2026 (founder: "most of them are automation numbers"): who answers decides the share, see lines.py
  decision_maker_mobile: 1.00   # the owner's own mobile
  decision_maker_email: 0.85    # the owner's own address
  business_mobile: 0.75         # a business mobile, nothing says who answers (often the owner of a small one)
  front_desk_mobile: 0.55       # reception, booking or the WhatsApp chat button: an auto-reply, then staff
  landline: 0.45
  email: 0.40                   # a shared inbox or a business address
  bot_line: 0.20                # a WhatsApp bot vendor, toll-free or helpline, a call centre, another country
  form: 0.20
  none: 0.00                    # no usable contact: grade D

reach_email_first:              # segments with outreach_channel: email (US, UK, AU, CA, SG; 13 Nov 2026)
  decision_maker_email: 1.00    # a decision maker's own address, published by the business
  email: 0.70                   # a company address published on its own site
  phone: 0.40                   # a phone only: a call, never a cold WhatsApp
  form: 0.30
  none: 0.00

total:
  reach_points: 20              # total = need + can_pay / cap * can_pay.points + fit bonus + reach * reach_points

grades: {A: 75, B: 55, C: 40}   # D under 40

fit_only_max_pct: 50            # fit-only leads a day per segment: at most this share of the other new leads,
fit_only_min_per_day: 5         # but always up to this many (strong fit-only businesses are real B leads)
judge_top_share: 0.5            # the best half by total (and every A) goes to the top model

# Score s3.0 (15 Nov 2026) for startup segments (domain firms); every other segment keeps s2.0 above.
# The target: startups of 2 to 10 people, idea to small seed (under about $2M raised), without a tech team.
# Funding alone is not the signal; funding plus no tech team is. Four parts that add up to 100:
#   need (0 to 35) + fit (0 to 25) + can pay (0 to 20) + reach (0 to 20)
# Grade D for more than settings startup.max_team people, a team with engineers, a late round, more than
# settings startup.max_raise_usd raised, or a business that is not a startup. The grade lines are the s2.0
# ones above (A 75, B 55, C 40), so the judge reads both scores the same way. pipeline/qualify.py works out the
# profile (tech team, size, money, product) and pipeline/score_startup.py the score.
startup:
  need:
    no_tech_team: 15            # two independent signs that nobody technical is on the team (contract 4.3)
    lone_cto: 8                 # exactly one technical person and no engineers
    one_sign: 7                 # one sign of no tech team so far
    stated_multiplier: 2.0      # their own ask or builder job post: signal points x 2.0, fresher counts more
    stated_cap: 20
    first_builder: 4            # the job post is for a founding engineer, first developer, CTO or technical co-founder
    trigger_multiplier: 1.6     # fresh funding, a launch or news: signal points x 1.6, fresher counts more
    trigger_cap: 8
    cap: 35
  fit:
    startup: {yes: 6, unknown: 3}
    size: {small: 6, mid: 5, solo: 3, unknown: 3}   # small: 2 to small_max people; mid: up to max_team; solo: 1
    small_max: 5
    stage: {early: 5, unknown: 2}                    # an early round (idea to seed) is known
    product: {to_build: 5, live: 3, unknown: 2}      # to_build: idea, landing, waitlist or no-code; live: an app
    young: {new: 3, middle: 1, old: 0, unknown: 1}   # online or founded within new_years, middle_years, or longer
    new_years: 3
    middle_years: 6
  can_pay:                      # the best money sign, the best revenue sign, plus the small ones, at most cap
    cap: 20
    raised_250k: 20             # raised at least $250,000 in the last funding_valid_days
    raised_50k: 16
    raised_small: 8
    round_known: 14             # an early round without an amount
    accelerator: 14
    crowdfunding: 10
    grant: 8
    revenue: 14                 # a stated revenue, ARR or MRR
    paying_customers: 10
    pricing: 6                  # published prices for their own product
    hiring_builder: 6           # a builder job post: there is a budget for building
    pays_for_tools: 3           # paid tools on their domain (Stripe, HubSpot, Google Workspace, ...)
    custom_domain: 2            # a live site on its own domain
    yes_at: 14                  # can_pay 'yes' from this many points, 'likely' from likely_at
    likely_at: 6
    funding_valid_days: 540     # money raised this long ago still counts
  reach:                        # the founder email ladder (contract 4.4); a guess counts only once checked
    verified_owner_email: 1.00
    likely_owner_email: 0.85    # catch-all or risky but backed by a published address, or published by the person
    company_email: 0.70
    phone: 0.40
    form: 0.30
    none: 0.00
  reach_points: 20
  tech:
    engineering_roles_team: 3   # a careers board with this many engineering roles: they are building a team
    github_members_team: 2      # public members of their GitHub org, with a push in the last github_active_days
    github_active_days: 180
    signal_days: 180            # job posts and public asks this recent count as signs
  max_age_years: 10             # founded or online longer ago, with no startup sign: not a startup
  caps:                         # the most a lead can grade when...
    no_contact: B               # nobody to email yet (founder_emails still searches B leads)
    no_gap_or_ask: B            # no sign of a missing tech team and no ask of their own: funding alone is not an A
    no_budget: C                # equity only or unpaid, and no money seen: not a buyer now
