overture: {categories: []}      # no map universe (universe: signals_only)
places: {queries: [], details_per_day: 0, reviews_per_day: 0}
registries: []
osm: {enabled: false}
apna: {pages_per_day: 0}
adzuna_enabled: false

job_keywords:
  frontdesk: [customer support executive, customer success executive, sales coordinator, telecaller,
              inside sales executive]
  builder: [full stack developer, web developer, app developer, mobile app developer, react developer,
            react native developer, flutter developer, node developer, python developer, backend developer,
            frontend developer, software developer, ai engineer, ml engineer, machine learning engineer,
            genai engineer, llm engineer, automation engineer, n8n, zapier, chatbot developer,
            whatsapp automation, shopify developer, wordpress developer, cto, tech lead]
  exclude: [teacher, faculty, driver, peon, nurse, accountant, delivery]

# Grounded search queries. A query that starts with "hiring:" looks for job posts and makes `hiring_builder`
# signals; the others look for public asks (`public_ask`). Job boards and LinkedIn are search snippets only,
# never fetched. Marketplaces (Upwork, Freelancer and similar) are never used. Every query runs every day here.
public_ask_queries:
  - "hiring: small company or startup in India hiring a full stack or web developer, job posted in the last 7 days"
  - "hiring: Indian startup hiring a React Native or Flutter mobile app developer, posted this week"
  - "hiring: small business in India hiring an AI engineer, automation engineer or chatbot developer, posted this week"
  - "hiring: founder-led company in India hiring its first developer or a freelance developer, posted recently"
  - "Indian business owner looking for a developer or agency to build an app or website, posted this week"
  - "founder in India looking for a tech partner or development agency to build an MVP, recent post"
  - "business in India looking for someone to build a WhatsApp chatbot or AI automation, recent post"
news_queries:
  - '("raises" OR "secures" OR "bags") ("seed" OR "pre-seed" OR "pre-Series A" OR "Series A") startup sourcecountry:IN'
  - '("launches" OR "unveils") ("D2C brand" OR "startup") ("app" OR "platform") sourcecountry:IN'

size_rules:
  any_of:
    - {source: business, key: staff_count, op: ">=", value: 3}
    - {source: business, key: branches_count, op: ">=", value: 1}

signal_points: {hiring_builder: 8, public_ask: 10}

fit:
  categories: [startup, small_business]   # no map category: the stated need itself is the type match
  service_keywords: [startup, saas, d2c, e-commerce, ecommerce, retail, fintech, edtech, healthtech, logistics,
                     manufacturing, real estate, restaurant, travel, fashion, platform, marketplace, brand]
  min_reviews: 100
  min_staff: 3

ticket_class:
  funded_startup: {match: [startup, saas, platform, fintech, edtech, healthtech, d2c], points: 5}
  smb:            {match: [small_business, brand, retail, manufacturing, logistics, restaurant, travel,
                           fashion, e-commerce, ecommerce], points: 4}

can_pay:
  premium_price: {other: 100000}       # INR, any product, plan or project price they publish

scoring: {}

packaged_outcome: Custom AI workflows

angles:
  - {key: build_what_they_asked, label: Their own stated need, signals: [public_ask, tender, hiring_builder],
     idea: "We build exactly what they are hiring for or asked for, shipped by a small senior team in weeks, so they skip a long hire."}
  - {key: frontdesk_load, label: Team overloaded with enquiries, signals: [hiring_frontdesk],
     idea: "An AI assistant answers routine customer questions on WhatsApp and the website, so the new hire handles only real work."}
  - {key: missed_calls, label: Customers waiting for replies, signals: [review_pain],
     idea: "Every customer message answered in seconds, day and night, with a hand-off to a person when needed."}
  - {key: ad_leads_cold, label: Ad leads going cold, signals: [ads_running],
     idea: "Every lead from ads gets an instant reply and follow-ups until it converts."}
  - {key: no_online_booking, label: No self-serve on the website, signals: [no_booking],
     idea: "Customers can book, order or get a quote on the website and WhatsApp without waiting for a call."}
  - {key: slow_site, label: Slow website, signals: [slow_site],
     idea: "A fast new website that turns visitors into enquiries."}
  - {key: growth_build, label: Growing or just funded, signals: [new_branch, news, new_place, funding],
     idea: "New funding or growth usually means a product backlog: we ship the next feature fast."}
  - {key: custom_ai_workflows, label: Custom AI workflows (no signal), signals: [fit_only],
     idea: "One custom AI workflow that saves the team hours a week, built in weeks."}
