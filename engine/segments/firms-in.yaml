# Startups without a tech team, India (founder reset, 15 Nov 2026): startups of 2 to 10 people, idea to small
# seed (under about $2M raised), with no technical person or a lone CTO. A business exists here only because a
# startup source found it (funding news, launch lists, filings, job posts, public asks); qualification
# (pipeline/qualify.py) and score s3.0 (pipeline/score_startup.py) decide who is a lead. Agencies, IT services
# firms and staffing companies are never leads here. Outreach is email only (config/outreach.yaml allows in).
id: firms-in
domain: firms
country: in
display_name: Startups without a tech team, India
enabled: true
timezone: Asia/Kolkata
currency: INR
universe: signals_only
outreach_channel: email          # the email autopilot writes to founders; never a cold WhatsApp

