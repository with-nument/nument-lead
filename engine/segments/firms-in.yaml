# The need-first track (founder, 13 Nov 2026): Indian SMEs and startups of any industry that say in public that
# they need a build right now: a job post for a developer, AI or automation person, or a public ask for an agency
# or developer. There is no map universe: a business exists here only because of such a signal, so every lead
# starts with a stated need. Agencies, IT services firms and staffing companies are competitors and never leads.
id: firms-in
domain: firms
country: in
display_name: SMEs and startups that need a build, India
enabled: true
timezone: Asia/Kolkata
currency: INR
universe: signals_only

quota:
  daily_research: 40

