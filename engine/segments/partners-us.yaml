# Marketing and design agencies (white-label partners), US (founder, 13 Nov 2026: 50 to 60 A and B leads a day across seven countries).
# Marketing, advertising, branding and design agencies as white-label partners: they sell, Nument builds under their brand. Software, app and IT shops are competitors and stay excluded.
id: partners-us
domain: partners
country: us
display_name: Marketing and design agencies (white-label partners), US
enabled: true
timezone: America/New_York
currency: USD
outreach_channel: email

quota:
  daily_research: 25

cities:
  - name: New York
    aliases: [New York City, NYC, Manhattan, Brooklyn]
    bbox: [-74.26, 40.49, -73.70, 40.92]
    localities: [Manhattan, Brooklyn, Queens]
  - name: San Francisco Bay Area
    aliases: [San Francisco, Bay Area, Palo Alto, Mountain View, San Jose, Oakland, Menlo Park]
    bbox: [-122.55, 37.20, -121.75, 37.90]
    localities: [SoMa, Palo Alto, San Jose]
  - name: Los Angeles
    aliases: [LA, Santa Monica]
    bbox: [-118.67, 33.70, -118.15, 34.34]
    localities: [Santa Monica, Downtown LA]
  - name: Austin
    aliases: []
    bbox: [-97.95, 30.10, -97.55, 30.52]
    localities: [Downtown Austin]
  - name: Seattle
    aliases: [Bellevue, Redmond]
    bbox: [-122.45, 47.48, -122.05, 47.74]
    localities: [Downtown Seattle, Bellevue]
  - name: Boston
    aliases: [Cambridge MA]
    bbox: [-71.20, 42.23, -70.99, 42.40]
    localities: [Back Bay, Kendall Square]
  - name: Chicago
    aliases: []
    bbox: [-87.94, 41.64, -87.52, 42.03]
    localities: [The Loop, River North]
  - name: Miami
    aliases: []
    bbox: [-80.45, 25.55, -80.12, 25.98]
    localities: [Brickell, Wynwood]
  - name: Denver
    aliases: [Boulder]
    bbox: [-105.30, 39.61, -104.80, 40.10]
    localities: [Downtown Denver, Boulder]
  - name: Dallas
    aliases: [Fort Worth, Plano]
    bbox: [-97.40, 32.62, -96.55, 33.10]
    localities: [Uptown Dallas, Plano]
  - name: Atlanta
    aliases: []
    bbox: [-84.55, 33.65, -84.29, 33.89]
    localities: [Midtown Atlanta]

overture:
  categories:                   # checked against Overture release 2026-10-21.0 (Pune, London, Austin)
    - marketing_agency
    - advertising_agency
    - social_media_agency
    - internet_marketing_service
    - b2b_advertising_and_marketing_service
    - b2b_marketing_consultant
    - web_designer
    - graphic_designer
    - public_relations
    - media_agency

places:                         # used only when a Google Maps key exists
  queries:
    - "marketing agency in {locality}, {city}"
    - "digital marketing agency in {locality}, {city}"
    - "branding agency in {locality}, {city}"
    - "design studio in {locality}, {city}"
  details_per_day: 0
  reviews_per_day: 0

registries: []
osm: {enabled: false}
apna: {pages_per_day: 0}
adzuna_enabled: false

job_keywords:
  frontdesk: [client servicing executive, account manager, client success manager]
  builder: [web developer, wordpress developer, shopify developer, webflow developer, full stack developer, front end developer, app developer, ai automation, automation specialist, n8n, zapier, chatbot developer, developer]
  exclude: [intern, sales, seo executive, content writer, graphic designer, video editor]

public_ask_queries:
  - "marketing agency in the US looking for a white-label development partner or outsourced dev team, recent post"
  - "hiring: digital marketing or design agency in the US hiring a web, Shopify or app developer, posted this week"
  - "hiring: marketing agency in the US hiring an AI automation or chatbot specialist, posted recently"
  - "agency owner in the US looking for a developer to build a client's app or AI chatbot, recent post"
news_queries:
  - '("agency" OR "studio") ("wins" OR "appointed" OR "bags") ("account" OR "mandate" OR "brief") sourcecountry:US'
  - '("marketing agency" OR "creative agency" OR "design agency") ("expands" OR "launches" OR "opens") sourcecountry:US'

size_rules:                     # an active stated need also passes
  any_of:
    - {source: business, key: staff_count, op: ">=", value: 3}
    - {source: fact, key: staff_or_doctors, field: count, op: ">=", value: 3}
    - {source: business, key: review_count, op: ">=", value: 15}

signal_points: {hiring_builder: 9, public_ask: 10, funding: 5}

fit:
  categories: [marketing_agency, advertising_agency, social_media_agency, internet_marketing_service, b2b_advertising_and_marketing_service, b2b_marketing_consultant, web_designer, graphic_designer, public_relations, media_agency, marketing agency, advertising agency, design agency]
  service_keywords: [digital marketing, performance marketing, social media, seo, branding, brand identity, web design, ui ux, content marketing, advertising, paid ads, google ads, meta ads, shopify, webflow, wordpress]
  min_reviews: 15
  min_staff: 3

ticket_class:                   # match order matters: the first class that matches wins
  performance: {match: [performance marketing, paid ads, google ads, meta ads, ecommerce, e-commerce], points: 5}
  brand_web: {match: [branding, web design, webflow, shopify, ui ux, design agency, web_designer], points: 5}
  general: {match: [marketing_agency, advertising_agency, digital marketing, social media, seo], points: 4}

can_pay:
  premium_price: {other: 1500}    # USD

scoring: {}

packaged_outcome: White-label dev and AI team

angles:
  - {key: build_what_they_asked, label: Their own stated need, signals: [public_ask, tender, hiring_builder],
     idea: "We become their white-label dev and AI team for exactly this, so they take the project without a new hire."}
  - {key: frontdesk_load, label: Client service overloaded, signals: [hiring_frontdesk],
     idea: "An AI assistant answers routine client and lead questions, and they can resell the same assistant to clients."}
  - {key: missed_calls, label: Leads waiting for replies, signals: [review_pain],
     idea: "Instant replies to every enquiry, theirs and their clients', built under their brand."}
  - {key: ad_leads_cold, label: Ad leads going cold, signals: [ads_running],
     idea: "AI lead follow-up they can bundle with their ad management, so clients' leads convert."}
  - {key: no_online_booking, label: Clients' sites without booking, signals: [no_booking],
     idea: "Booking, quote and checkout flows for their clients' sites, delivered under their brand."}
  - {key: slow_site, label: Slow website, signals: [slow_site],
     idea: "Fast rebuilds of slow sites for them and their clients, under their brand."}
  - {key: growth_capacity, label: Growing or new accounts, signals: [new_branch, news, new_place, funding],
     idea: "New accounts mean more builds: a senior dev and AI team on call, no hiring."}
  - {key: white_label_team, label: White-label dev and AI team (no signal), signals: [fit_only],
     idea: "A senior dev and AI team under their brand for client apps, sites and AI work they'd otherwise turn down."}
