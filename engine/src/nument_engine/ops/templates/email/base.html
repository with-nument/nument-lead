<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ subject }}</title>
<style>
  @media (max-width: 620px) {
    .wrap { padding: 12px !important; }
    .card { border-radius: 14px !important; }
    .pad { padding-left: 20px !important; padding-right: 20px !important; }
    .kpi { display: inline-block !important; width: 50% !important; padding: 0 4px 8px 4px !important; box-sizing: border-box; }
    .kpis { margin: 0 -4px !important; }
    .btn { display: block !important; width: 100% !important; box-sizing: border-box !important; margin: 0 0 8px 0 !important; text-align: center !important; }
    .h1 { font-size: 26px !important; line-height: 32px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;-webkit-text-size-adjust:100%;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#f5f5f5;">{{ preheader }}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;">
<tr><td class="wrap" align="center" style="padding:32px 16px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;">
    <tr><td style="padding:0 4px 14px 4px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
        <td style="font:600 14px/20px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f1f1f;">
          <img src="{{ app_url }}/icon-192.png" width="22" height="22" alt="" style="vertical-align:-5px;border-radius:6px;margin-right:8px;">Nument <span style="color:#999999;font-weight:500;">Leads</span>
        </td>
        <td align="right" style="font:500 13px/20px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#999999;">{{ date_label }}</td>
      </tr></table>
    </td></tr>
    <tr><td class="card" style="background:#ffffff;border:1px solid #ececec;border-radius:16px;">
      {% block body %}{% endblock %}
    </td></tr>
    <tr><td style="padding:18px 8px 0 8px;font:400 12px/18px -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#999999;text-align:center;">
      {% block footer %}{% endblock %}
      <br><a href="{{ app_url }}/settings" style="color:#999999;text-decoration:underline;">Email settings</a> &nbsp;·&nbsp; Nument Leads, made by Nument
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
