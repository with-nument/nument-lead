[project]
name = "nument-engine"
version = "0.1.0"
description = "Nument Leads engine: finds, researches, scores and writes leads"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx[http2]>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "psycopg[binary,pool]>=3.2",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "playwright>=1.47",
    "trafilatura>=1.12",
    "extruct>=0.17",
    "selectolax>=0.3.21",
    "phonenumbers>=8.13",
    "tldextract>=5.1",
    "rapidfuzz>=3.9",
    "google-genai>=1.0",
    "openai>=1.50",
    "gspread>=6.1",
    "google-auth>=2.34",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.8",
    "structlog>=24.4",
    "python-dateutil>=2.9",
]

[project.scripts]
nlead = "nument_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nument_engine"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-python-dateutil",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
    "live: hits real APIs or the dev database (skipped in CI)",
]
